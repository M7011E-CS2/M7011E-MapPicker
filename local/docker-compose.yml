# Local development infrastructure. Start with:
#   docker compose -f local/docker-compose.yml up -d
# The credentials below are for local development only — never reuse them in the cluster.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
      POSTGRES_DB: user_service
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user_service']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
