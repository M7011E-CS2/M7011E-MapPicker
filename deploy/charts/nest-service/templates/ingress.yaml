{{- if .Values.ingress.enabled }}
{{- $fullname := include "nest-service.fullname" . }}
{{- $stripPrefix := and .Values.ingress.stripPrefix (eq .Values.ingress.className "traefik") }}
{{- if $stripPrefix }}
# Traefik middleware: /api/users/health -> /health before it reaches the pod.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-strip-prefix
  labels:
    {{- include "nest-service.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ required "ingress.path is required" .Values.ingress.path }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "nest-service.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    # cert-manager sees this and requests a Let's Encrypt certificate
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- if $stripPrefix }}
    # Format: <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullname }}-strip-prefix@kubernetescrd
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: {{ required "ingress.path is required" .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
