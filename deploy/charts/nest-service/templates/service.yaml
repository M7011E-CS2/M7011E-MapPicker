apiVersion: v1
kind: Service
metadata:
  name: {{ include "nest-service.fullname" . }}
  labels:
    {{- include "nest-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nest-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http   # the named container port in the Deployment
      protocol: TCP
