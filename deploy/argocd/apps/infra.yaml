# Argo CD Application for shared cluster resources in deploy/infra/
# (plain manifests, no Helm), e.g. the cs2-tls Certificate that every
# service's Ingress uses. Without this app nothing applies deploy/infra/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  # When this Application is deleted, also delete the Kubernetes resources it created.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/M7011E-CS2/M7011E-MapPicker.git
    targetRevision: main
    path: deploy/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: mappick
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from git
      selfHeal: true   # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
