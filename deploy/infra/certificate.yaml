# deploy/infra/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cs2-tls
  namespace: mappick
spec:
  secretName: cs2-tls
  dnsNames:
    - cs2.group-3-m7011e-ltu.se
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging    # switch to letsencrypt-prod when it works