# deploy/infra/postgres.yaml
# One shared PostgreSQL server for all services. Each service gets its OWN
# database + user (AGENTS.md rule 1), created by the init script below.
#
# Secrets (created by hand, see docs/deployment.md — never in git):
#   postgres-admin   key "password"                 superuser "postgres"
#   user-service-db  keys "password", "DATABASE_URL" login "user_service"
#
# Services connect to: postgres.mappick.svc.cluster.local:5432
---
# Runs ONCE, the first time Postgres starts with an empty volume.
# To add a database for a new service: add a block here AND create it by hand
# on the running server (the script will not run again on existing data).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mappick
data:
  01-create-service-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    # The password is passed as a psql variable (:'pw'), which psql quotes
    # safely — it is never concatenated into the SQL string.
    psql -v ON_ERROR_STOP=1 -v pw="$USER_SERVICE_DB_PASSWORD" \
          --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE USER user_service WITH PASSWORD :'pw';
    CREATE DATABASE user_service OWNER user_service;
    SQL
---
# Headless Service: gives the StatefulSet pod a stable DNS name "postgres".
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mappick
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mappick
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      # uid/gid 999 = the "postgres" user in the official image.
      # fsGroup makes the mounted volume writable for that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17   # same major version as local/docker-compose.yml
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
            - name: USER_SERVICE_DB_PASSWORD   # read by the init script
              valueFrom:
                secretKeyRef:
                  name: user-service-db
                  key: password
            # Subfolder, because the volume root may contain "lost+found",
            # which initdb refuses to use.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Startup: first boot (initdb) and crash recovery can take minutes on a
          # slow disk. Liveness/readiness only start once this succeeds, so
          # Kubernetes does not kill Postgres mid-recovery (which would leave it
          # unclean again and cause an endless restart loop).
          # Allows up to 30 x 10s = 5 minutes.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  # One PersistentVolumeClaim per pod (data-postgres-0), provisioned by k3s'
  # default "local-path" StorageClass. It survives pod restarts and is NOT
  # deleted when the StatefulSet is deleted.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
