# user-service values for the generic chart deploy/charts/nest-service.
# image.tag is updated automatically by .github/workflows/build.yml — do not edit by hand.
# (No blank lines: yq rewrites the file on each bump and would remove them.)
image:
  repository: ghcr.io/m7011e-cs2/user-service
  tag: "e270101a65fbac8bdd5dd39518170ac3620b56d7"
# Pull credentials for GHCR (remove if the package is made public)
imagePullSecrets:
  - name: ghcr-pull
env:
  NODE_ENV: production
ingress:
  enabled: true
  path: /api/users
  tls:
    enabled: true
    clusterIssuer: "" # empty = no cert-manager annotation on the Ingress
    secretName: cs2-tls # every service uses the shared certificate
