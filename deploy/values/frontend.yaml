# frontend values for the generic chart deploy/charts/nest-service.
# image.tag is updated automatically by .github/workflows/build.yml — do not edit by hand.
# (No blank lines: yq rewrites the file on each bump and would remove them.)
image:
  repository: ghcr.io/m7011e-cs2/frontend
  tag: "eeb7b5f0867f5e08feb21687d67e57805f3dab5f"
containerPort: 8080
probes:
  path: /
ingress:
  enabled: true
  path: /
  stripPrefix: false
